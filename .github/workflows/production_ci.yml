name: Production CI

# Gate that protects production: nothing reaches Render unless the full
# 185-test suite passes AND the React frontend compiles.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: prod-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend — full pytest suite (Postgres + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoreach
          POSTGRES_PASSWORD: autoreach
          POSTGRES_DB: autoreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoreach"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://autoreach:autoreach@localhost:5432/autoreach_test
      REDIS_URL: redis://localhost:6379/0
      AUTOREACH_JWT_SECRET: ci-prod-test-secret
      AUTOREACH_SESSION_SECRET: ci-prod-session-secret
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (psycopg2)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U autoreach && break
            echo "waiting for postgres ($i)…"; sleep 2
          done

      - name: Run full test suite (fail on first failure)
        run: pytest tests/ -q --maxfail=1

  frontend-build:
    name: Frontend — Vite/React build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard (fail on compile error)
        working-directory: dashboard
        run: npm run build

      - name: Assert build artifact exists
        run: test -f cockpit/static/dashboard/index.html

  # Deploy gate: both jobs must pass. This job exists so branch protection can
  # require a single status check, and so a deploy webhook can key off it.
  ready-to-deploy:
    name: Ready to deploy
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "✅ Backend tests + frontend build green — safe to deploy to Render."
