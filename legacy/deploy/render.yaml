databases:
  - name: autoreach-db
    plan: free
    databaseName: autoreach
    user: autoreach

services:
  - type: web
    name: autoreach-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoreach-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: autoreach-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: APP_DOMAIN
        value: autoreach-web.onrender.com

  - type: worker
    name: autoreach-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_worker.celery worker --loglevel=info --concurrency=2 -Q campaigns,maintenance
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoreach-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: autoreach-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: redis
    name: autoreach-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
