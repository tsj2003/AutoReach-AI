<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - AutoReach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen" x-data="logsView()">
    <!-- Sidebar -->
    <div class="fixed left-0 top-0 h-full w-64 gradient-bg text-white p-6">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center"><span class="text-2xl">🚀</span></div>
            <div><h1 class="font-bold text-xl">AutoReach</h1><p class="text-xs text-white/70">Campaign Manager</p></div>
        </div>
        <nav class="space-y-2">
            <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition"><span>📊</span> Dashboard</a>
            <a href="/campaigns" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition"><span>📧</span> Campaigns</a>
            <a href="/logs" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-white/20 text-white"><span>📋</span> Logs</a>
            <a href="/settings" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition"><span>⚙️</span> Settings</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="ml-64 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">📋 Campaign Logs</h1>
            <div class="flex gap-3">
                <select x-model="filter" class="px-4 py-2 border rounded-lg bg-white">
                    <option value="all">All Logs</option>
                    <option value="success">✓ Sent Only</option>
                    <option value="error">✗ Errors Only</option>
                    <option value="warning">⚠ Warnings Only</option>
                </select>
                <button @click="fetchLogs()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition">
                    🔄 Refresh
                </button>
                <label class="flex items-center gap-2 px-4 py-2 bg-white border rounded-lg cursor-pointer">
                    <input type="checkbox" x-model="autoRefresh" class="rounded">
                    <span class="text-sm">Auto-refresh</span>
                </label>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center">
                    <span class="text-green-600">✓</span>
                </div>
                <div>
                    <p class="text-2xl font-bold text-gray-800" x-text="stats.sent"></p>
                    <p class="text-xs text-gray-500">Emails Sent</p>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center">
                    <span class="text-red-600">✗</span>
                </div>
                <div>
                    <p class="text-2xl font-bold text-gray-800" x-text="stats.errors"></p>
                    <p class="text-xs text-gray-500">Errors</p>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center">
                    <span class="text-yellow-600">⚠</span>
                </div>
                <div>
                    <p class="text-2xl font-bold text-gray-800" x-text="stats.warnings"></p>
                    <p class="text-xs text-gray-500">Warnings</p>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
                    <span class="text-blue-600">📝</span>
                </div>
                <div>
                    <p class="text-2xl font-bold text-gray-800" x-text="logs.length"></p>
                    <p class="text-xs text-gray-500">Total Entries</p>
                </div>
            </div>
        </div>

        <!-- Log Terminal -->
        <div class="bg-gray-900 rounded-xl shadow-lg overflow-hidden">
            <div class="bg-gray-800 px-4 py-2 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="ml-4 text-gray-400 text-sm mono">nohup_resume.out</span>
                </div>
                <span class="text-gray-500 text-xs" x-text="'Last updated: ' + lastUpdated"></span>
            </div>
            <div class="p-4 h-[600px] overflow-y-auto mono text-sm">
                <template x-for="(log, index) in filteredLogs" :key="index">
                    <div :class="{
                        'text-green-400': log.type === 'success',
                        'text-red-400': log.type === 'error',
                        'text-yellow-400': log.type === 'warning',
                        'text-gray-400': log.type === 'info'
                    }" class="py-1 border-b border-gray-800 hover:bg-gray-800/50">
                        <span class="text-gray-600 mr-2" x-text="(index + 1).toString().padStart(4, '0')"></span>
                        <span x-text="log.raw"></span>
                    </div>
                </template>
                <div x-show="logs.length === 0" class="text-gray-500 text-center py-10">
                    No log entries found
                </div>
            </div>
        </div>
    </div>

    <script>
        function logsView() {
            return {
                logs: [],
                filter: 'all',
                autoRefresh: false,
                lastUpdated: 'Never',
                stats: { sent: 0, errors: 0, warnings: 0 },
                interval: null,

                async init() {
                    await this.fetchLogs();
                    this.$watch('autoRefresh', (val) => {
                        if (val) {
                            this.interval = setInterval(() => this.fetchLogs(), 5000);
                        } else if (this.interval) {
                            clearInterval(this.interval);
                        }
                    });
                },

                async fetchLogs() {
                    try {
                        const res = await fetch('/api/logs?lines=200');
                        const data = await res.json();
                        this.logs = data.logs;
                        this.lastUpdated = new Date().toLocaleTimeString();
                        
                        // Calculate stats
                        this.stats.sent = this.logs.filter(l => l.type === 'success').length;
                        this.stats.errors = this.logs.filter(l => l.type === 'error').length;
                        this.stats.warnings = this.logs.filter(l => l.type === 'warning').length;
                    } catch (e) {
                        console.error('Failed to fetch logs', e);
                    }
                },

                get filteredLogs() {
                    if (this.filter === 'all') return this.logs;
                    return this.logs.filter(l => l.type === this.filter);
                }
            };
        }
    </script>
</body>
</html>
