databases:
  - name: autoreach-db
    plan: free
    databaseName: autoreach
    user: autoreach

services:
  - type: web
    name: autoreach-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && (cd dashboard && npm ci && npm run build)
    startCommand: gunicorn asgi:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoreach-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: autoreach-redis
          type: redis
          property: connectionString
      - key: AUTOREACH_JWT_SECRET
        generateValue: true
      - key: AUTOREACH_SESSION_SECRET
        generateValue: true
      # Legacy operator console is unauthenticated — keep it OFF in production.
      - key: AUTOREACH_ENABLE_CONSOLE
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SIGNIN_CLIENT_ID
        sync: false
      - key: CALCOM_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: autoreach-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2 -Q engine,maintenance
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoreach-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: autoreach-redis
          type: redis
          property: connectionString
      - key: AUTOREACH_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: worker
    name: autoreach-beat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_worker.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoreach-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: autoreach-redis
          type: redis
          property: connectionString

  - type: redis
    name: autoreach-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
